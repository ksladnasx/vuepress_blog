<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>文章后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="access-view" id="access-view" aria-labelledby="access-title">
        <div class="access-panel">
          <p class="eyebrow">XH BLOG</p>
          <h1 id="access-title">文章后台</h1>
          <p class="access-copy">使用专门为此仓库创建的 GitHub Token 进入写作区。</p>

          <form id="access-form" class="access-form">
            <label for="token">GitHub Token</label>
            <div class="token-input">
              <input
                id="token"
                name="token"
                type="password"
                autocomplete="current-password"
                spellcheck="false"
                required
              />
              <button
                class="icon-button"
                id="token-visibility"
                type="button"
                aria-label="显示 Token"
                data-tooltip="显示或隐藏"
              >
                <span aria-hidden="true">◉</span>
              </button>
            </div>
            <p class="form-note">令牌只在当前标签页使用，本站不会保存它。</p>
            <button class="primary-button" id="access-submit" type="submit">进入后台</button>
          </form>
          <p class="access-status" id="access-status" role="status"></p>
        </div>
      </section>

      <section class="workspace" id="workspace" hidden>
        <header class="app-header">
          <a class="brand" href="/" aria-label="返回博客首页">
            <span class="brand-mark">XH</span>
            <span>文章后台</span>
          </a>
          <div class="account">
            <span id="account-name"></span>
            <button class="quiet-button" id="sign-out" type="button">退出</button>
          </div>
        </header>

        <div class="app-layout">
          <aside class="article-panel" aria-label="文章列表">
            <div class="panel-header">
              <div>
                <p class="eyebrow">文章</p>
                <p class="article-count" id="article-count">载入中</p>
              </div>
              <button
                class="icon-button accent"
                id="new-article"
                type="button"
                aria-label="新建文章"
                data-tooltip="新建文章"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
            <label class="sr-only" for="article-search">筛选文章</label>
            <input
              class="search-input"
              id="article-search"
              type="search"
              placeholder="筛选文章"
              autocomplete="off"
            />
            <nav class="article-list" id="article-list"></nav>
          </aside>

          <section class="editor-panel" aria-label="文章编辑器">
            <div class="editor-header">
              <div>
                <p class="eyebrow" id="editor-mode">新文章</p>
                <p class="file-path" id="file-path">尚未创建文件</p>
              </div>
              <div class="editor-actions">
                <button class="quiet-button" id="reset-editor" type="button">重置</button>
                <button class="primary-button" id="publish-article" type="button">发布更新</button>
              </div>
            </div>

            <form id="article-form" class="article-form">
              <div class="metadata-grid">
                <label class="field field-wide">
                  <span>标题</span>
                  <input id="article-title" type="text" required placeholder="输入文章标题" />
                </label>
                <label class="field">
                  <span>日期</span>
                  <input id="article-date" type="date" required />
                </label>
                <label class="field">
                  <span>存放目录</span>
                  <input
                    id="article-folder"
                    type="text"
                    list="folder-options"
                    required
                    placeholder="例如 vuelearning"
                    spellcheck="false"
                  />
                  <datalist id="folder-options"></datalist>
                </label>
                <label class="field">
                  <span>分类</span>
                  <input id="article-category" type="text" placeholder="多个分类用逗号分隔" />
                </label>
                <label class="field">
                  <span>标签</span>
                  <input id="article-tags" type="text" placeholder="多个标签用逗号分隔" />
                </label>
              </div>

              <details class="advanced-fields">
                <summary>其他文章信息</summary>
                <label class="field">
                  <span>额外 Frontmatter</span>
                  <textarea
                    id="article-extra"
                    rows="4"
                    placeholder="author: xh&#10;sticky: 1"
                    spellcheck="false"
                  ></textarea>
                </label>
              </details>

              <div class="content-toolbar" aria-label="Markdown 工具">
                <button class="tool-button" type="button" data-wrap="strong" title="加粗">B</button>
                <button class="tool-button italic" type="button" data-wrap="emphasis" title="斜体">I</button>
                <button class="tool-button code-tool" type="button" data-wrap="code" title="行内代码">&lt;/&gt;</button>
                <button class="tool-button" type="button" data-wrap="link" title="链接">链接</button>
                <label class="upload-button" title="上传图片">
                  <input id="image-upload" type="file" accept="image/*" />
                  图片
                </label>
              </div>
              <label class="sr-only" for="article-body">正文</label>
              <textarea
                id="article-body"
                class="body-editor"
                placeholder="从这里开始写正文..."
                spellcheck="true"
              ></textarea>
            </form>

            <p class="publish-status" id="publish-status" role="status"></p>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
