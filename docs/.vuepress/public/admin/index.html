<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data: blob: https://i.ibb.co; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>文章后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="access-view" id="access-view" aria-labelledby="access-title">
        <div class="access-panel">
          <p class="eyebrow">XH BLOG / ADMIN</p>
          <h1 id="access-title">文章后台</h1>
          <p class="access-copy">使用专门为此仓库创建的 GitHub Token 进入。</p>

          <form id="access-form" class="access-form">
            <label for="token">GitHub Token</label>
            <div class="token-input">
              <input
                id="token"
                name="token"
                type="password"
                autocomplete="current-password"
                spellcheck="false"
                required
              />
              <button
                class="icon-button"
                id="token-visibility"
                type="button"
                aria-label="显示 Token"
                data-tooltip="显示或隐藏"
              >
                <span class="visibility-glyph" aria-hidden="true"></span>
              </button>
            </div>
            <p class="form-note">令牌会保存在本机浏览器中，退出后台后会清除。</p>
            <button class="primary-button" id="access-submit" type="submit">进入后台</button>
          </form>
          <div class="access-loading" id="access-loading" aria-live="polite" hidden>
            <span class="access-spinner" aria-hidden="true"></span>
            <span id="access-loading-text">正在进入后台...</span>
          </div>
          <p class="access-status" id="access-status" role="status"></p>
        </div>
      </section>

      <section class="workspace" id="workspace" data-mobile-view="library" hidden>
        <header class="app-header">
          <div class="brand">
            <span class="brand-mark" role="img">
              <img
                src="https://i.ibb.co/d4F1NSMr/b-815a814aec2ee024eb3211e41f487e05.jpg"
                alt=""
                referrerpolicy="no-referrer"
              />
            </span>
            <span class="brand-copy">
              <strong>文章后台</strong>
              <small>内容管理</small>
            </span>
          </div>

          <div class="header-actions">
            <button
              class="icon-button"
              id="theme-toggle"
              type="button"
              aria-label="切换明暗主题"
              data-tooltip="切换主题"
            >
              <svg
                class="icon-svg"
                id="theme-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              ></svg>
            </button>
            <button class="primary-button publish-all-button" id="publish-all" type="button" disabled>
              <svg
                class="icon-svg icon-svg-filled"
                viewBox="0 0 1024 1024"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M896 608a32 32 0 0 1 31.850667 28.928L928 640v96c0 115.946667-93.312 210.133333-209.450667 213.248l-5.909333 0.085333h-401.28c-116.885333 0-212.138667-92.288-215.274667-207.466666L96 736V640a32 32 0 0 1 63.850667-3.072L160 640v96c0 80.704 64.96 146.602667 146.261333 149.248l5.12 0.085333h401.258667c81.962667 0 148.586667-64.234667 151.274667-144.298666l0.085333-5.034667V640a32 32 0 0 1 32-32zM503.978667 123.370667a32 32 0 0 1 34.752-1.706667l2.624 1.706667 266.666666 192a32 32 0 0 1-34.794666 53.610666l-2.581334-1.685333L522.666667 188.757333l-247.978667 178.56a32 32 0 0 1-42.730667-4.864l-1.92-2.432a32 32 0 0 1 4.842667-42.730666l2.432-1.92 266.666667-192z" />
                <path d="M522.666667 704a32 32 0 0 1-32-32v-490.666667a32 32 0 0 1 64 0v490.666667a32 32 0 0 1-32 32z" />
              </svg>
              <span>发布修改</span>
              <span class="change-badge" id="change-badge" hidden>0</span>
            </button>
            <button class="primary-button new-article-button" id="new-article" type="button">
              <span class="plus-glyph" aria-hidden="true"></span>
              <span>新建文章</span>
            </button>
            <button
              class="icon-button"
              id="sign-out"
              type="button"
              aria-label="退出后台"
              data-tooltip="退出"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5" />
                <path d="M21 12H9" />
              </svg>
            </button>
            <a
              class="icon-button"
              href="/"
              aria-label="返回博客首页"
              data-tooltip="返回首页"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 10.8 12 3l9 7.8" />
                <path d="M5 10v10h14V10" />
                <path d="M9 20v-6h6v6" />
              </svg>
            </a>
          </div>
        </header>

        <div class="app-layout">
          <aside class="article-panel" aria-label="文章库">
            <div class="article-panel-header">
              <div>
                <p class="eyebrow">文章库</p>
                <p class="article-count" id="article-count">正在读取文章</p>
              </div>
            </div>
            <label class="sr-only" for="article-search">搜索文章</label>
            <div class="search-field">
              <span class="search-glyph" aria-hidden="true"></span>
              <input
                id="article-search"
                type="search"
                placeholder="搜索文章、分类或目录"
                autocomplete="off"
              />
            </div>
            <nav class="article-list" id="article-list" aria-label="按分类浏览文章"></nav>
          </aside>

          <section class="editor-shell" aria-label="文章工作台">
            <div class="editor-empty" id="editor-empty">
              <p class="eyebrow">文章工作台</p>
              <h2>选择一篇文章</h2>
              <p class="empty-count" id="empty-count"></p>
              <button class="primary-button" id="empty-create" type="button">
                <span class="plus-glyph" aria-hidden="true"></span>
                <span>新建文章</span>
              </button>
            </div>

            <div class="editor-loading" id="editor-loading" aria-live="polite" hidden>
              <div class="loading-copy">
                <p class="eyebrow">正在读取</p>
                <h2>加载文章内容</h2>
              </div>
              <div class="loading-lines" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>

            <section class="editor-panel" id="editor-panel" hidden>
              <header class="editor-header">
                <div class="editor-identification">
                  <button
                    class="icon-button mobile-back-button"
                    id="mobile-back"
                    type="button"
                    aria-label="返回文章库"
                    data-tooltip="返回文章库"
                  >
                    <span class="back-glyph" aria-hidden="true"></span>
                  </button>
                  <div>
                    <p class="eyebrow" id="editor-mode">编辑文章</p>
                    <p class="file-path" id="file-path"></p>
                  </div>
                </div>
                <div class="editor-actions">
                  <span class="draft-status" id="draft-status">已同步</span>
                  <button class="quiet-button" id="save-draft" type="button">保存草稿</button>
                  <button class="quiet-button" id="reset-editor" type="button">还原</button>
                  <button class="quiet-button" id="undo-delete" type="button" hidden>撤销删除</button>
                  <button
                    class="icon-button danger-button"
                    id="delete-article"
                    type="button"
                    aria-label="标记删除"
                    data-tooltip="标记删除"
                    hidden
                  >
                    <svg t="1786854724733" class="icon icon-delete" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="9712" width="200" height="200" aria-hidden="true"><path d="M519.620465 0c-103.924093 0-188.511256 82.467721-192.083349 185.820279H85.015814A48.91386 48.91386 0 0 0 36.101953 234.686512a48.91386 48.91386 0 0 0 48.913861 48.866232h54.010046V831.345116c0 102.852465 69.822512 186.844279 155.909954 186.844279h439.200744c86.087442 0 155.909953-83.491721 155.909954-186.844279V284.100465h48.91386a48.91386 48.91386 0 0 0 48.913861-48.890046 48.91386 48.91386 0 0 0-48.913861-48.866233h-227.756651A191.559442 191.559442 0 0 0 519.620465 0z m-107.234232 177.080558c3.548279-49.771163 46.627721-88.540279 99.851907-88.540279 53.224186 0 96.327442 38.745302 99.351813 88.540279h-199.20372z m-111.997024 752.044651c-30.981953 0-65.083535-39.15014-65.083535-95.041488V287.744h575.488v546.839814c0 55.915163-34.077767 95.041488-65.059721 95.041488H300.389209v-0.500093z" fill="#D81E06" p-id="9713"></path><path d="M368.116093 796.814884c24.361674 0 44.27014-21.670698 44.27014-48.818605v-278.623256c0-27.147907-19.908465-48.818605-44.27014-48.818604-24.33786 0-44.27014 21.670698-44.27014 48.818604v278.623256c0 27.147907 19.360744 48.818605 44.293954 48.818605z m154.933581 0c24.361674 0 44.293953-21.670698 44.293954-48.818605v-278.623256c0-27.147907-19.932279-48.818605-44.293954-48.818604-24.33786 0-44.27014 21.670698-44.270139 48.818604v278.623256c0 27.147907 19.932279 48.818605 44.293953 48.818605z m132.810419 0c24.33786 0 44.27014-21.670698 44.27014-48.818605v-278.623256c0-27.147907-19.932279-48.818605-44.27014-48.818604s-44.27014 21.670698-44.27014 48.818604v278.623256c0 27.147907 19.360744 48.818605 44.27014 48.818605z" fill="#D81E06" p-id="9714"></path></svg>
                  </button>
                </div>
              </header>

              <form id="article-form" class="article-form">
                <div class="editor-scroll">
                  <div class="delete-banner" id="delete-banner" hidden>
                    <p>这篇文章已加入待删除队列。发布修改前，你仍然可以撤销。</p>
                  </div>

                  <div class="metadata-grid">
                    <div class="field date-field">
                      <span>日期</span>
                      <div class="date-control" id="date-control">
                        <input
                          id="article-date"
                          type="text"
                          inputmode="numeric"
                          required
                          placeholder="YYYY-MM-DD"
                          autocomplete="off"
                        />
                        <button
                          class="calendar-button"
                          id="date-picker"
                          type="button"
                          aria-label="选择日期"
                        >
                          <span class="calendar-glyph" aria-hidden="true"></span>
                        </button>
                      </div>
                      <div class="date-menu" id="date-menu" hidden></div>
                    </div>
                    <div class="field folder-field">
                      <span>存放目录</span>
                      <div class="multi-control folder-control" id="folder-control">
                        <input
                          id="article-folder"
                          type="text"
                          required
                          placeholder="搜索或新建目录"
                          autocomplete="off"
                          spellcheck="false"
                        />
                      </div>
                      <div class="multi-menu" id="folder-menu" hidden></div>
                    </div>

                    <div class="field multi-field">
                      <span>分类</span>
                      <div class="multi-control" id="category-control">
                        <div class="multi-chips" id="category-chips"></div>
                        <input
                          id="category-input"
                          type="text"
                          placeholder="搜索或新增分类"
                          autocomplete="off"
                        />
                      </div>
                      <div class="multi-menu" id="category-menu" hidden></div>
                    </div>

                    <div class="field multi-field">
                      <span>标签</span>
                      <div class="multi-control" id="tag-control">
                        <div class="multi-chips" id="tag-chips"></div>
                        <input
                          id="tag-input"
                          type="text"
                          placeholder="搜索或新增标签"
                          autocomplete="off"
                        />
                      </div>
                      <div class="multi-menu" id="tag-menu" hidden></div>
                    </div>
                  </div>

                  <details class="advanced-fields">
                    <summary>其他文章信息</summary>
                    <label class="field">
                      <span>额外 Frontmatter</span>
                      <textarea
                        id="article-extra"
                        rows="4"
                        placeholder="author: xh&#10;sticky: 1"
                        spellcheck="false"
                      ></textarea>
                    </label>
                  </details>

                  <div class="content-toolbar" aria-label="Markdown 工具">
                    <button class="tool-button" type="button" data-wrap="strong" title="加粗">B</button>
                    <button class="tool-button italic" type="button" data-wrap="emphasis" title="斜体">I</button>
                    <button class="tool-button code-tool" type="button" data-wrap="code" title="行内代码">&lt;/&gt;</button>
                    <button class="tool-button" type="button" data-wrap="link" title="链接">链接</button>
                    <label class="upload-button" title="添加图片草稿">
                      <input id="image-upload" type="file" accept="image/*" />
                      图片
                    </label>
                  </div>
                  <label class="sr-only" for="article-body">正文</label>
                  <textarea
                    id="article-body"
                    class="body-editor"
                    placeholder="# 文章标题&#10;&#10;从这里开始写正文..."
                    spellcheck="true"
                  ></textarea>
                </div>
              </form>

              <p class="publish-status" id="publish-status" role="status"></p>
            </section>
          </section>
        </div>
      </section>
    </main>

    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-title">
      <form method="dialog">
        <p class="eyebrow">标记删除</p>
        <h2 id="delete-title">加入待删除队列？</h2>
        <p id="delete-description"></p>
        <div class="dialog-actions">
          <button class="quiet-button" value="cancel" type="submit">取消</button>
          <button class="danger-action" id="confirm-delete" value="confirm" type="button">标记删除</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-copy" id="toast-copy"></span>
      <span class="toast-progress" id="toast-progress"></span>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
